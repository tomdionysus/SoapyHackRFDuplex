#
# Keeps the pinned GitHub Actions current: a pull request against develop
# when one has a new release, its commit and the release named.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
