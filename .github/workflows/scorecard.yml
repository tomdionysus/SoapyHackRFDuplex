# SPDX-License-Identifier: GPL-3.0-or-later
#
# OpenSSF Scorecard: rates the repository's security practices (pinned
# dependencies, branch protection, CI, code review and the rest), shows the
# findings in the repository's code scanning, and publishes the score to
# OpenSSF for the README's badge. Weekly, and on a push to main.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # A token that may read the repository's administration, without
          # which the Branch-Protection check cannot see the rules.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: results.sarif
