# SPDX-License-Identifier: GPL-3.0-or-later
#
# The checks of tools/ci.sh on every push and pull request, in a Debian
# trixie container, the distribution the target runs: formatting, licence
# lines, the release, sanitizer and receive-correction builds and their
# tests, Clang's thread-safety analysis, clang-tidy, the coverage report
# (kept here as an artifact and in the job summary) and, which the
# Raspberry Pi target cannot run, ThreadSanitizer. Everything runs against
# the fake boards; the hardware is checked on the target with
# hackrfduplex-check.
name: ci

on:
  push:
    branches: [develop, main]
    tags: ['*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      # LeakSanitizer needs ptrace.
      options: --cap-add=SYS_PTRACE
    steps:
      - name: Packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake pkgconf git ca-certificates \
            libhackrf-dev libsoapysdr-dev catch2 libliquid-dev \
            clang-19 clang-tidy-19 clang-format lcov
      - uses: actions/checkout@v4
      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: tools/ci.sh
        run: tools/ci.sh
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build-coverage/coverage.log ]; then
            {
              echo '### Coverage'
              echo '```'
              grep -A3 'Summary coverage' build-coverage/coverage.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage/html
          if-no-files-found: ignore
